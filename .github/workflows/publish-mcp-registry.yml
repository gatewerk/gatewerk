name: Publish to MCP Registry

# Publishes packages/mcp/server.json to registry.modelcontextprotocol.io.
# OIDC from this repo proves the io.github.gatewerk namespace, so no
# tokens and no interactive login are involved. Run AFTER the matching
# @gatewerk/mcp version is live on npm; the registry validates that the
# npm package named in server.json exists at the listed version.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC authentication with the registry
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Pinned version + checksum: this job holds an OIDC token that can
      # publish under io.github.gatewerk, so it must never execute an
      # unpinned binary fetched at run time. Bump the version and checksum
      # together from the release's checksums.txt.
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to the registry
        run: ../../mcp-publisher login github-oidc
        working-directory: packages/mcp

      - name: Publish server.json
        run: ../../mcp-publisher publish
        working-directory: packages/mcp
