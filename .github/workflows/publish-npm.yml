name: Publish npm packages

# Trusted publishing via npm provenance (OIDC) — no NODE_AUTH_TOKEN.
# Pending trusted-publisher config on npmjs.com for each package:
#
#   Package: gatewerk
#     https://www.npmjs.com/package/gatewerk/access
#     GitHub Actions → Owner: gatewerk · Repo: gatewerk
#     Workflow: publish-npm.yml · Environment: npm
#
#   Package: @gatewerk/mcp
#     https://www.npmjs.com/package/@gatewerk/mcp/access
#     GitHub Actions → Owner: gatewerk · Repo: gatewerk
#     Workflow: publish-npm.yml · Environment: npm
#
#   Package: n8n-nodes-gatewerk
#     https://www.npmjs.com/package/n8n-nodes-gatewerk/access
#     GitHub Actions → Owner: gatewerk · Repo: gatewerk
#     Workflow: publish-npm.yml · Environment: npm
#
# npm CLI >=11.5.1 and Node >=22.14 are required for provenance.
# This workflow uses Node 24 (satisfies both).

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - gatewerk
          - '@gatewerk/mcp'
          - n8n-nodes-gatewerk

jobs:
  publish:
    name: Publish ${{ github.event.inputs.package }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ github.event.inputs.package }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      # Deliberately NO registry-url. Passing it makes setup-node write an
      # .npmrc containing //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN},
      # and with no token in the environment that expands to setup-node's
      # literal placeholder XXXXX-XXXXX-XXXXX-XXXXX. npm then authenticates
      # with that junk string instead of performing the trusted-publishing
      # OIDC exchange, and the registry answers 404 (npm reports authorization
      # failures as 404 so it cannot be used to probe which packages exist).
      # registry.npmjs.org is the default registry anyway.
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Trusted publishing (OIDC, no token) needs npm >= 11.5.1. Node 24 ships
      # an npm that may predate it, so pin the CLI explicitly rather than
      # inheriting whatever the runner image happens to carry.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      # Map package choice to workspace directory and filter token for pnpm.
      # sdk-ts (gatewerk) is a dependency of mcp, so both need to be installed
      # when publishing mcp. The --filter flag handles workspace resolution.
      - name: Resolve package directory
        id: pkg
        env:
          PACKAGE: ${{ github.event.inputs.package }}
        run: |
          case "$PACKAGE" in
            gatewerk)
              echo "dir=packages/sdk-ts" >> "$GITHUB_OUTPUT"
              echo "filter=gatewerk..." >> "$GITHUB_OUTPUT"
              ;;
            '@gatewerk/mcp')
              echo "dir=packages/mcp" >> "$GITHUB_OUTPUT"
              echo "filter=@gatewerk/mcp..." >> "$GITHUB_OUTPUT"
              ;;
            n8n-nodes-gatewerk)
              echo "dir=packages/n8n-nodes-gatewerk" >> "$GITHUB_OUTPUT"
              echo "filter=n8n-nodes-gatewerk..." >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown package: $PACKAGE"
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "${{ steps.pkg.outputs.filter }}"

      # Workspace dependencies must be built before the package itself: mcp
      # needs the gatewerk SDK's dist and types, and both need
      # @gatewerk/shared. The ^... filter selects the package's workspace
      # dependencies (excluding the package) in topological order.
      - name: Build workspace dependencies
        env:
          PACKAGE: ${{ github.event.inputs.package }}
        run: pnpm --filter "${PACKAGE}^..." build

      - name: Build package
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm build

      # Two tools, because each does one half and neither does both.
      #
      # pnpm PACKS. @gatewerk/mcp depends on `gatewerk` as `workspace:*`, and
      # only pnpm rewrites that protocol to a real version when it builds the
      # tarball. Packed by npm it would ship the literal "workspace:*" and every
      # install would fail with EUNSUPPORTEDPROTOCOL.
      #
      # npm PUBLISHES. Trusted publishing exchanges the Actions OIDC token for a
      # short-lived registry credential, and that exchange is implemented in the
      # npm CLI. pnpm 9 does not do it: it signs provenance happily (that is
      # sigstore, a separate mechanism) and then authenticates from .npmrc, so
      # against a trusted-publisher-only package it gets a 404 — which looks
      # like an npmjs.com permissions problem but isn't.
      #
      # Publishing a prebuilt tarball keeps both halves: the file already holds
      # pnpm's rewritten dependency, and npm handles auth and provenance.
      - name: Pack with pnpm (rewrites workspace:* to a real version)
        id: pack
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP"
          TARBALL="$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' | head -1)"
          if [ -z "$TARBALL" ]; then
            echo "::error::pnpm pack produced no tarball"
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL"

      # Fails loudly rather than shipping a tarball that cannot be installed.
      - name: Refuse to publish an unresolvable workspace protocol
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inspect"
          tar xzf "$TARBALL" -C "$RUNNER_TEMP/inspect"
          if grep -q '"workspace:' "$RUNNER_TEMP/inspect/package/package.json"; then
            echo "::error::tarball still contains a workspace: dependency"
            cat "$RUNNER_TEMP/inspect/package/package.json"
            exit 1
          fi
          echo "OK: no workspace: protocol in the packed manifest"

      # Trusted publishing is silent when it does not engage: npm simply reports
      # ENEEDAUTH, which is indistinguishable from "you forgot a token". These
      # two lines say whether the OIDC token endpoint was injected at all, which
      # is the difference between a workflow-permissions problem and an
      # npmjs.com configuration problem.
      - name: Show whether the OIDC token endpoint is available
        run: |
          set -euo pipefail
          echo "id-token endpoint present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "registry: $(npm config get registry)"

      - name: Publish to npm with provenance
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          npm publish "$TARBALL" --provenance --access public --loglevel verbose
