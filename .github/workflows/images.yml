name: Build and push OCI images
#
# Both jobs here build OSS images: Dockerfile.api and Dockerfile.web-next,
# neither of which copies the private ./ee submodule. So no checkout step in
# this file wants a `submodules:` key — adding one would put the commercial
# code into the build context of images that get published to a public
# registry.
#
# Cloud images are not built here at all. They are built on the VPS by
# docker/deploy-cloud.sh, from docker-compose.cloud.yml, using the .cloud
# Dockerfile variants. If a cloud image job is ever added to CI it will need a
# token with read access to gatewerk/gatewerk-ee, because the default
# GITHUB_TOKEN cannot read another private repo.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/gatewerk/gatewerk-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/gatewerk/gatewerk-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.web-next
          push: true
          platforms: linux/amd64,linux/arm64
          # NOTE: this image no longer bakes VITE_API_URL. That was true of
          # Dockerfile.web; Dockerfile.web-next never declares it, because no
          # source file reads it — the API client calls relative paths that
          # nginx proxies to the gatewerk-api service. A custom-domain
          # deployment therefore needs NO local rebuild for the API URL, which
          # is the opposite of what this note used to tell people.
          #
          # This image cannot be smoke-tested with a bare `docker run`. It
          # carries docker/nginx.conf, which proxies /api/ to the literal host
          # `gatewerk-api`, and nginx resolves upstreams at startup — without an
          # api container reachable under that name the container exits with
          # "host not found in upstream". Kept from the retired web-next job,
          # where this was first written down.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

