name: Publish sdk-py to PyPI

# Trusted publishing via OIDC — no long-lived PyPI token.
# Pending publisher config required at:
#   https://pypi.org/manage/account/publishing/
# Settings (must match exactly):
#   PyPI Publisher: GitHub
#   Owner: gatewerk
#   Repository name: gatewerk
#   Workflow filename: publish-sdk-py.yml
#   Environment name: pypi

on:
  push:
    tags:
      - 'sdk-py-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only (skip publish)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  build:
    name: Build sdk-py
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/sdk-py-v')
        working-directory: packages/sdk-py
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # REF_NAME is the tag name, e.g. "sdk-py-v0.1.1". Parameter expansion
          # strips the prefix to recover the bare version.
          TAG_VERSION="${REF_NAME#sdk-py-v}"
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed -E 's/version = "(.+)"/\1/')
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version does not match pyproject.toml. Aborting publish."
            echo "  tag:        $TAG_VERSION"
            echo "  pyproject:  $PYPROJECT_VERSION"
            exit 1
          fi
          echo "Tag and pyproject agree: $TAG_VERSION"

      - name: Build sdist + wheel
        working-directory: packages/sdk-py
        run: uv build

      - name: Inspect built artifacts
        run: ls -la packages/sdk-py/dist/

      - name: Upload built artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-py-dist
          path: packages/sdk-py/dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gatewerk
    permissions:
      id-token: write

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-py-dist
          path: dist/

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
          print-hash: true
