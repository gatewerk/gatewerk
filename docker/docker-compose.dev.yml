services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatewerk
      POSTGRES_PASSWORD: gatewerk
      POSTGRES_DB: gatewerk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatewerk"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
