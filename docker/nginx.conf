server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security ──────────────────────────────────────────
    server_tokens off;

    # All add_header directives live exclusively at the server block level.
    # nginx inheritance rule: a location block that calls add_header silently
    # drops ALL server-block headers. Keeping headers here (not in any
    # location block) ensures every response — HTML, JS, CSS, fonts, API
    # proxy — carries the full security header set with no duplication risk.

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # CSP for React SPA served from nginx. API has its own CSP via Helmet.
    # 'unsafe-inline' for script-src: React Router inline bootstrap scripts in index.html.
    # 'unsafe-inline' for style-src: Tailwind inline styles.
    # challenges.cloudflare.com: Turnstile CAPTCHA (script + iframe + connect).
    # *.posthog.com in script-src: PostHog bootstraps by injecting a script tag
    #   from us-assets.i.posthog.com (array/<key>/config.js) + the session
    #   recorder. Without it, script-src blocks PostHog and cloud analytics is
    #   dead. Standalone never sets VITE_POSTHOG_KEY, so this host is simply
    #   never contacted there — harmless to allow.
    # worker-src blob:: Sentry + PostHog Replay Web Workers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://*.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.gatewerk.com https://*.supabase.co https://*.posthog.com https://*.sentry.io https://challenges.cloudflare.com; font-src 'self' data:; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; worker-src blob:; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Block dotfile access (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip_static on;

    location /api/ {
        proxy_pass http://gatewerk-api:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://gatewerk-api:3100;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # The HTML shell must always be revalidated. index.html carries no
        # content hash, and it references the hashed asset bundle which is
        # cached immutably for 1y (below). Without this, browsers heuristically
        # cache index.html, so a returning visitor keeps loading the OLD shell
        # -> OLD (still-cached) asset hashes -> stranded on a stale build across
        # deploys until they manually clear cache. `no-cache` = store but always
        # revalidate (If-Modified-Since against last-modified), so a new deploy
        # is picked up on the next request.
        #
        # The `expires` directive is used here on purpose instead of a
        # response-header directive: `expires` does not reset nginx's header
        # inheritance, so the server-block security headers (CSP/HSTS/etc.)
        # still apply to the shell. `expires -1` emits `Cache-Control: no-cache`.
        expires -1;
    }

    # Static assets: use expires (sets Cache-Control: max-age automatically).
    # No add_header here — would silently drop all server-block security headers.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 1y;
    }
}
